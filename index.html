<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CBAS 報價查詢</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">CBAS Monitor</p>
        <h1>CBAS 報價查詢</h1>
        <p id="subtitle" class="subtitle">讀取資料中。</p>
      </div>
      <nav class="header-actions" aria-label="主要功能">
        <a class="active" href="./index.html">報價</a>
        <a href="./primary.html">初級市場</a>
        <a href="./redemption.html">到期贖回</a>
        <button id="downloadJson" type="button" title="下載 JSON">JSON</button>
        <button id="downloadCsv" type="button" title="下載目前報價">CSV</button>
      </nav>
    </header>

    <main>
      <section class="metrics" id="metrics"></section>

      <section class="toolbar" aria-label="報價查詢工具">
        <label>
          <span>搜尋</span>
          <input id="searchInput" type="search" placeholder="CB 代碼、名稱、日期" />
        </label>
        <label>
          <span>來源檔</span>
          <select id="sourceSelect"><option value="">全部來源</option></select>
        </label>
        <label>
          <span>排序</span>
          <select id="sortSelect">
            <option value="code">CB 代碼</option>
            <option value="premium">權利金</option>
            <option value="date">選擇權到期日</option>
            <option value="parity">轉換價值</option>
          </select>
        </label>
      </section>

      <section class="quote-layout">
        <article class="watchlist">
          <div class="section-heading">
            <div><p class="eyebrow">Focus</p><h2>優先觀察標的</h2></div>
            <span id="watchlistCount"></span>
          </div>
          <div id="watchlistRows" class="watchlist-rows"></div>
        </article>
      </section>

      <section class="table-section">
        <div class="section-heading">
          <div><p class="eyebrow">Quotes</p><h2>券商報價</h2></div>
          <span id="rowCount"></span>
        </div>
        <div class="table-wrap">
          <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
        </div>
      </section>
    </main>

    <script src="./data/cbas-latest.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
