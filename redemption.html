<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>CB 到期贖回｜CB Market Desk V2</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="redemption">
    <header class="site-header">
      <a class="brand" href="./index.html">
        <span class="brand-mark">CB</span>
        <span><strong>Market Desk</strong><small>可轉債事件與交易工作台</small></span>
      </a>
      <nav aria-label="主要功能">
        <a href="./index.html">報價</a>
        <a href="https://cbas-market-dashboard-o1dgkwfiw-vmja2004-6574s-projects.vercel.app/filing-calendar.html">申報與生效</a>
        <a href="./primary.html">初級市場</a>
        <a href="./issued.html">發行與掛牌</a>
        <a href="./banks.html">專戶與行庫</a>
        <a class="active" href="./redemption.html">到期贖回</a>
      </nav>
      <div id="freshness" class="freshness"></div>
    </header>

    <main>
      <section class="hero danger-hero">
        <div>
          <p class="eyebrow">REDEMPTION & MATURITY</p>
          <h1>到期贖回</h1>
          <p>整合強制贖回、賣回與到期事件；事件先跨來源去重，再以倒數天數標示時效。</p>
        </div>
        <button class="outline-button" id="downloadCsv" type="button">匯出目前結果</button>
      </section>

      <section id="metrics" class="metrics" aria-label="資料摘要"></section>

      <section class="workspace">
        <div class="workspace-head">
          <div><p class="eyebrow">FILTERS</p><h2>事件篩選</h2></div>
          <button id="resetFilters" class="text-button" type="button">清除條件</button>
        </div>
        <div class="filter-grid">
          <label class="wide"><span>搜尋事件</span><input id="searchInput" type="search" placeholder="CB 代碼、股票代碼、名稱或事件類型" /></label>
          <label><span>日期基準</span><select id="dateFieldSelect"></select></label>
          <label><span>事件類型</span><select id="typeSelect"></select></label>
          <label><span>顯示月份</span><select id="monthSelect"></select></label>
        </div>
      </section>

      <section class="calendar-card">
        <div class="calendar-head">
          <button id="prevMonth" type="button" aria-label="上一個月">‹</button>
          <div><p class="eyebrow">CALENDAR</p><h2 id="monthTitle"></h2></div>
          <button id="nextMonth" type="button" aria-label="下一個月">›</button>
        </div>
        <div class="weekday-row"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <section class="table-card">
        <div class="section-head">
          <div><p class="eyebrow">EVENT LIST</p><h2>到期與贖回事件</h2></div>
          <span id="rowCount" class="count-pill"></span>
        </div>
        <div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
      </section>
    </main>

    <footer>CB Market Desk V2 · 事件倒數以瀏覽當日計算，正式處分前仍應核對公司公告。</footer>
    <script src="./data/cbas-latest.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
